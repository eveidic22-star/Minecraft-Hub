<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a href="#" class="header__logo" onclick="showPage('home')">
        <span class="logo-icon">&#9618;</span> Minecraft Hub
      </a>
      <nav class="header__nav">
        <a href="#" class="nav-link active" data-page="home" onclick="showPage('home')">Главная</a>
        <a href="#" class="nav-link" data-page="mods" onclick="showPage('mods')">Моды</a>
        <a href="#" class="nav-link" data-page="skins" onclick="showPage('skins')">Скины</a>
        <a href="#" class="nav-link" data-page="builds" onclick="showPage('builds')">Сборки</a>
      </nav>
      <button class="menu-toggle" onclick="toggleMenu()">&#9776;</button>
    </div>
  </header>

  <main>
    <!-- HOME -->
    <section id="page-home" class="page active">
      <div class="hero">
        <h1 class="hero__title">Minecraft Hub</h1>
        <p class="hero__subtitle">Моды, скины и сборки в одном месте</p>
      </div>
      <div class="categories">
        <div class="category-card" onclick="showPage('mods')">
          <div class="category-card__icon">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M24 4L44 16V32L24 44L4 32V16L24 4Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
              <path d="M24 44V24" stroke="currentColor" stroke-width="2.5"/>
              <path d="M44 16L24 24L4 16" stroke="currentColor" stroke-width="2.5"/>
              <path d="M14 10L34 20" stroke="currentColor" stroke-width="2" opacity="0.4"/>
            </svg>
          </div>
          <h2>Моды</h2>
          <p id="mods-count">0 модов</p>
        </div>
        <div class="category-card" onclick="showPage('skins')">
          <div class="category-card__icon">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="24" cy="16" r="8" stroke="currentColor" stroke-width="2.5"/>
              <path d="M8 42C8 34.268 15.163 28 24 28C32.837 28 40 34.268 40 42" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
              <rect x="18" y="12" width="3" height="3" rx="0.5" fill="currentColor" opacity="0.6"/>
              <rect x="27" y="12" width="3" height="3" rx="0.5" fill="currentColor" opacity="0.6"/>
            </svg>
          </div>
          <h2>Скины</h2>
          <p id="skins-count">0 скинов</p>
        </div>
        <div class="category-card" onclick="showPage('builds')">
          <div class="category-card__icon">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 22L24 6L42 22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="10" y="22" width="28" height="20" stroke="currentColor" stroke-width="2.5"/>
              <rect x="20" y="30" width="8" height="12" stroke="currentColor" stroke-width="2"/>
              <rect x="14" y="26" width="5" height="5" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
              <rect x="29" y="26" width="5" height="5" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
            </svg>
          </div>
          <h2>Сборки</h2>
          <p id="builds-count">0 сборок</p>
        </div>
      </div>
    </section>

    <!-- MODS -->
    <section id="page-mods" class="page">
      <div class="page-header">
        <h1>Моды</h1>
        <div class="filters">
          <input type="text" id="mods-search" placeholder="Поиск модов..." oninput="filterItems('mods')">
          <select id="mods-filter" onchange="filterItems('mods')">
            <option value="all">Все теги</option>
          </select>
        </div>
      </div>
      <div id="mods-list" class="items-grid"></div>
    </section>

    <!-- SKINS -->
    <section id="page-skins" class="page">
      <div class="page-header">
        <h1>Скины</h1>
        <div class="filters">
          <input type="text" id="skins-search" placeholder="Поиск скинов..." oninput="filterItems('skins')">
        </div>
      </div>
      <div id="skins-list" class="items-grid"></div>
    </section>

    <!-- BUILDS -->
    <section id="page-builds" class="page">
      <div class="page-header">
        <h1>Сборки</h1>
        <div class="filters">
          <input type="text" id="builds-search" placeholder="Поиск сборок..." oninput="filterItems('builds')">
          <select id="builds-filter" onchange="filterItems('builds')">
            <option value="all">Все теги</option>
          </select>
        </div>
      </div>
      <div id="builds-list" class="items-grid"></div>
    </section>

    <!-- ITEM DETAIL -->
    <section id="page-detail" class="page">
      <button class="back-btn" onclick="goBack()">&larr; Назад</button>
      <div id="detail-content"></div>
    </section>
  </main>

  <!-- MODAL for image gallery -->
  <div id="modal" class="modal" onclick="closeModal(event)">
    <div class="modal__content">
      <button class="modal__close" onclick="closeModal()">&times;</button>
      <img id="modal-img" src="" alt="">
    </div>
  </div>

  <footer class="footer">
    <p>Minecraft Hub &mdash; фан-проект. Minecraft является trademark Mojang Studios.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
